$hx_background = rgba(122434ff)
$hx_inner = rgba(12243499)
$hx_foreground = rgba(e6f1f4ff)
$hx_accent = rgba(7ed6ffff)
$hx_outline = rgba(2770c0ff) rgba(a44185cc) 45deg
$hx_error = rgba(ff6b81ff)
source = @HYPRIXE_THEME@/hyprlock.conf

# Frosted Glass. Theme/path generated by install.sh for the selected XDG data dir.
background {
    monitor =
    path = $HOME/.local/share/hyprixe/current-wallpaper
    color = $hx_background
    blur_size = 3
    blur_passes = 2
    noise = 0.0117
    contrast = 1.3
    brightness = 0.8
    vibrancy = 0.21
}
label {
    monitor =
    text = $TIME
    color = $hx_accent
    font_size = 96
    font_family = JetBrains Mono
    position = 0, -80
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date '+%A %d %B'
    color = $hx_foreground
    font_size = 26
    font_family = JetBrains Mono
    position = 0, 35
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 300, 60
    rounding = 13
    outline_thickness = 2
    outer_color = $hx_outline
    inner_color = $hx_inner
    font_color = $hx_foreground
    check_color = $hx_accent
    fail_color = $hx_error
    font_family = JetBrains Mono
    placeholder_text = <i>Mot de passe…</i>
    fail_text = Échec ($ATTEMPTS)
    dots_center = true
    fade_on_empty = false
    position = 0, -100
    halign = center
    valign = bottom
}
label {
    monitor =
    text = $USER · $LAYOUT
    color = $hx_foreground
    font_size = 16
    position = 0, -35
    halign = center
    valign = bottom
}
