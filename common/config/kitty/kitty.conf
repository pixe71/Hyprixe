# Hyprixe Frosted Glass. Blur and rounding belong to Hyprland.
# JetBrains Mono is supplied by Debian's fonts-jetbrains-mono package.
font_family JetBrains Mono
# Keep the text font; use the pinned Nerd Font only for private-use symbols.
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFF Symbols Nerd Font Mono
font_size 12.0

background #122434
foreground #e6f1f4
background_opacity 0.92
cursor #e6f1f4
cursor_text_color #122434
selection_background #7ed6ff
selection_foreground #122434
url_color #b4f9f8

window_padding_width 10
window_border_width 0
hide_window_decorations yes
scrollback_lines 10000

# Keep Kitty's native copy/paste, selection, links, tabs and splits bindings.
color0  #012339
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7ed6ff
color5  #a44185
color6  #b4f9f8
color7  #cbe2e8
color8  #4d7a8a
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7ed6ff
color13 #a44185
color14 #b4f9f8
color15 #e6f1f4
