# Rendered by install.sh. Also covers an already-enabled Debian Waybar service.
[Unit]
Wants=hyprixe-wallpaper.service
After=hyprixe-wallpaper.service

[Service]
EnvironmentFile=-%t/uwsm/env_session.conf
Slice=app-graphical.slice
ExecStart=
ExecStart="@WAYBAR_EXEC@" -c "@HYPR_CONFIG@/waybar/configs/Frosted-Glass" -s "@HYPR_CONFIG@/waybar/style.css"
